<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashemiat</title>
    <meta
      name="description"
      content="Hashemiat is home to a growing collection of products."
    />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7233936709914566"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Hashemiat home">
          <span class="brand-mark">H</span>
          <span class="brand-name">Hashemiat</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="#projects">Projects</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <h1>Welcome to Hashemiat.</h1>
        </section>

        <section class="projects-section" id="projects">
          <div class="section-heading">
            <h2>Projects</h2>
          </div>

          <div class="projects-grid">
            <a
              class="project-card"
              href="https://reasoning.hashemiat.com"
              target="_blank"
              rel="noreferrer"
            >
              <img
                class="project-thumbnail"
                src="./thumbnails/cognitive-assessment-platform.svg"
                alt=""
              />
              <div class="project-content">
                <h3>cognitive-assessment-platform</h3>
                <span class="project-link">reasoning.hashemiat.com</span>
              </div>
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
